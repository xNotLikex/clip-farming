twitch:
  client_id: ''
  client_secret: ''
  time_filter: LAST_DAY
  hours_back: 12
autopilot:
  enabled: true
  interval_minutes: 30
  time_filter: LAST_DAY
  fallback_to_week: true
  auto_render: false
video:
  hardware_encoder: auto
  use_nvenc: true
  whisper_model: small
  device: cuda
  audio_normalize: true
  subtitles:
    enabled: true
    font_name: Arial Black
    font_size: 24
    max_words_per_segment: 3
    highlight_color: '&H0000FFFF'
    primary_color: '&H00FFFFFF'
    outline_color: '&H00000000'
    outline_width: 3
ai_copywriter:
  provider: gemini
  model: gemini-2.5-flash
  api_key: ''
  language: de
publishing:
  drip_feed_hours: 3
  youtube:
    enabled: true
    privacy_status: private
    client_secrets_file: config/youtube_secrets.json
  tiktok:
    enabled: true
    upload_mode: public
    session_id: ''
storage:
  auto_cleanup_raw: true
  database_path: data/pipeline.db
